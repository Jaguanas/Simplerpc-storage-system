apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: simplerpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      containers:
        - name: storage
          image: jaguanas/simplerpc-storage:0.1.0
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: simplerpc
spec:
  selector:
    app: storage
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP